# Railway uses Nixpacks to build — WeasyPrint needs system libraries (Pango, Cairo, etc.)
[phases.setup]
nixPkgs = [
  "python311",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "fontconfig",
  "libffi",
  "pkg-config",
  "gobject-introspection",
  "glib",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
